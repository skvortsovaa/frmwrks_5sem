{% extends "base.html" %}
{% block title %}Редактирование помещения | SmartSpace Monitor{% endblock %}
{% block content %}
<h1>Редактирование помещения</h1>
<p>{{ room.name }}</p>
<form method="post" enctype="multipart/form-data" class="col-lg-7" novalidate>
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-outline-secondary" href="{{ room.get_absolute_url }}">К помещению</a>
</form>
{% endblock %}
